<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iFlix</title>

<!-- iOS standalone / Safari support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iFlix">
<link rel="apple-touch-icon" href="icon.png">

<style>
html, body { margin:0; padding:0; height:100%; font-family:'Helvetica',sans-serif; background:#eee; overflow:hidden; -webkit-overflow-scrolling: touch; }
#statusBar { height:20px; background:#000; color:#fff; font-size:12px; text-align:center; line-height:20px; }
#tabBar { position:fixed; bottom:0; width:100%; height:50px; display:flex; background:#ddd; border-top:1px solid #aaa; }
.tab { flex:1; text-align:center; line-height:50px; border-right:1px solid #aaa; cursor:pointer; font-weight:bold; color:#333; }
.tab:last-child { border-right:none; }
.tab.active { background:#bbb; }
.page { display:none; padding:10px; margin-bottom:50px; height: calc(100% - 70px); overflow-y:auto; }
.page.active { display:block; }
.button { padding:10px 20px; display:inline-block; margin:5px 0; text-align:center; cursor:pointer; border:1px solid #888; border-radius:10px; background:linear-gradient(to bottom,#fff,#ccc); box-shadow:0 2px 2px rgba(0,0,0,0.3); }
.videoItem { background:#fff; border:1px solid #aaa; border-radius:8px; padding:8px; margin:5px 0; }
.videoItem h4 { margin:0 0 5px 0; font-size:14px; }
.videoItem video { width:100%; max-width:320px; display:block; }
#notification { position:fixed; top:-60px; left:50%; transform:translateX(-50%); width:90%; max-width:320px; background:#fff; border:1px solid #888; border-radius:10px; padding:10px; box-shadow:0 2px 5px rgba(0,0,0,0.5); text-align:center; z-index:9999; transition: top 0.5s; }
</style>
</head>
<body>
<div id="statusBar">iFlix</div>

<!-- Pages -->
<div id="home" class="page active"><h3>Home Feed</h3><div id="videoList"></div></div>
<div id="subscriptions" class="page"><h3>Subscriptions</h3><div id="subscriptionList"></div></div>
<div id="upload" class="page">
<h3>Upload Video</h3>
<form id="uploadForm">
<label>Username:</label><input type="text" id="username" placeholder="Anonymous or your nickname" required>
<label>Video URL:</label><input type="url" id="videoURL" placeholder="Direct MP4 link" required>
<label>Category:</label><select id="category"><option value="cat">Funny Cats</option><option value="skate-fail">Skate Fails</option><option value="other">Other 2010 vibe</option></select>
<label>Video Title:</label><input type="text" id="videoTitle" placeholder="My 6 Skating Fails / Funny Cats for 2010" required>
<div class="button" id="submitUpload">Upload Video</div>
</form>
</div>
<div id="settings" class="page"><h3>Settings</h3><p>Retro vibes only.</p></div>

<!-- Tab bar -->
<div id="tabBar">
<div class="tab active" data-page="home">Home</div>
<div class="tab" data-page="subscriptions">Subs</div>
<div class="tab" data-page="upload">Upload</div>
<div class="tab" data-page="settings">Settings</div>
</div>

<div id="notification"></div>

<script>
// --- Tabs ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.page).classList.add('active');
  });
});

// --- Video DB ---
var videoDB = JSON.parse(localStorage.getItem('videoDB') || '[]');

function renderVideos() {
  const list = document.getElementById('videoList');
  list.innerHTML = '';
  videoDB.slice().reverse().forEach(v => {
    const div = document.createElement('div');
    div.className = 'videoItem';
    div.innerHTML = `<h4>${v.title} (${v.username})</h4>
                     <video src="${v.url}" controls></video>`;
    list.appendChild(div);
  });
}

function renderSubscriptions() {
  const list = document.getElementById('subscriptionList');
  list.innerHTML = '';
  const subs = JSON.parse(localStorage.getItem('subscriptions') || '[]');
  subs.forEach(u => {
    const btn = document.createElement('div');
    btn.className = 'button';
    btn.textContent = 'Unsubscribe ' + u;
    btn.addEventListener('click', () => {
      const i = subs.indexOf(u);
      if (i > -1) subs.splice(i, 1);
      localStorage.setItem('subscriptions', JSON.stringify(subs));
      renderSubscriptions();
    });
    list.appendChild(btn);
  });
}

// --- Notifications ---
function notify(msg) {
  const n = document.getElementById('notification');
  n.textContent = msg;
  n.style.top = '10px';
  setTimeout(() => { n.style.top = '-60px'; }, 3000);
}

// --- Upload ---
document.getElementById('submitUpload').addEventListener('click', () => {
  const username = document.getElementById('username').value.trim() || 'Anonymous';
  const url = document.getElementById('videoURL').value.trim();
  const category = document.getElementById('category').value;
  const title = document.getElementById('videoTitle').value.trim();
  const t = title.toLowerCase();
  
  if (!t.includes('skate') && !t.includes('fail') && !t.includes('cat') && !t.includes('2010')) {
    alert('Your title is not retro enough! Example: "My 6 Skating Fails" or "Funny Cats for 2010".');
    return;
  }
  
  videoDB.push({username, url, category, title, timestamp: new Date().toISOString()});
  localStorage.setItem('videoDB', JSON.stringify(videoDB));
  renderVideos();
  notify('Video uploaded: ' + title);
  document.getElementById('uploadForm').reset();
});

// --- Subscription notifications ---
function checkSubs() {
  const subs = JSON.parse(localStorage.getItem('subscriptions') || '[]');
  videoDB.forEach(v => {
    if (subs.includes(v.username) && !v.notified) {
      notify(v.username + ' just posted a new video!');
      v.notified = true;
    }
  });
  localStorage.setItem('videoDB', JSON.stringify(videoDB));
}

// --- Initial render ---
renderVideos();
renderSubscriptions();
setInterval(checkSubs, 10000);
</script>
</body>
</html>
